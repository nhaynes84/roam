plugins {
    id 'com.android.application' version '9.3.1' apply false
    // ⚠️ Kotlin 2.x moved the Compose compiler OUT of AGP's composeOptions and into
    //    its own plugin. Keeping the old kotlinCompilerExtensionVersion block here
    //    fails with a message that does not mention Compose at all.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.1.0' apply false
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.1.0' apply false
}
