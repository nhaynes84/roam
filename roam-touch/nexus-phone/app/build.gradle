plugins {
    id 'com.android.application'
    // ⚠️ NO org.jetbrains.kotlin.android here. AGP 9 has Kotlin support BUILT IN and
    //    registers its own `kotlin` extension; applying the old plugin fails with
    //    "Cannot add extension with name 'kotlin'", which does not mention AGP at all.
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

def localProps = new Properties()
def f = rootProject.file('local.properties')
if (f.exists()) { f.withInputStream { localProps.load(it) } }
def prop = { String k, String d -> localProps.getProperty(k, d) }

android {
    namespace 'com.roam.nexus'
    // Android 17. The platform calls itself 37.0 (minor-SDK scheme); AGP 9 accepts
    // the plain major here and resolves the installed platform.
    compileSdk 37

    defaultConfig {
        applicationId "com.roam.nexus"
        // ⚠️ 31, not 26. This build is for ONE device — a Pixel 11. Dragging a floor
        //    back to Oreo costs desugaring and compat paths for hardware that will
        //    never run it; the wrist launcher over in ../nexus is where old Android
        //    is a real requirement.
        minSdk 31
        targetSdk 37
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "HUB_HOST", "\"${prop('roam.hub.host', '100.67.237.109')}\""
        buildConfigField "int",    "HUB_PORT", "${prop('roam.hub.port', '8787')}"
        buildConfigField "String", "HUB_TOKEN", "\"${prop('roam.hub.token', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideloaded, never through Play
        }
    }

    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlin { jvmToolchain(17) }

    // ★ ONE implementation of the wire format. ../nexus/app's model/ and net/ are
    //   already the hub protocol client and are launcher-clean, so this points at
    //   them rather than forking. A copy drifts the moment the hub's contract moves,
    //   and the app that breaks silently is always the one nobody rebuilt.
    sourceSets {
        main {
            // ⚠️ kotlin.srcDirs, not java.srcDirs. AGP 9 compiles Kotlin itself and
            //    .kt files sitting in a java source dir are simply not seen — the
            //    build fails with "Unresolved reference 'touch'", which points at
            //    the imports rather than at the source set that never loaded.
            def shared = [
                    "$rootDir/../nexus/app/src/main/java/com/roam/touch/channels/model",
                    "$rootDir/../nexus/app/src/main/java/com/roam/touch/channels/net",
            ]
            kotlin.srcDirs += shared
            java.srcDirs += shared
        }
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
}
