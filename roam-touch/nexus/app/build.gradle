plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// ⚠️ The hub token is a shared secret and must not enter git. It is read from
// local.properties (already gitignored) at build time, exactly the way sdk.dir is.
// A missing token still builds — the app then shows HUB REFUSED TOKEN, which is a
// visible, diagnosable state rather than a mysterious silence.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def prop = { String key, String fallback ->
    return localProps.getProperty(key, System.getenv(key.toUpperCase().replace('.', '_')) ?: fallback)
}

android {
    namespace 'com.roam.touch'
    compileSdk 34

    defaultConfig {
        applicationId "com.roam.touch"
        minSdk 26
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk 29
        versionCode 4
        versionName "0.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "HUB_HOST", "\"${prop('roam.hub.host', '100.67.237.109')}\""
        buildConfigField "int", "HUB_PORT", "${prop('roam.hub.port', '8787')}"
        buildConfigField "String", "HUB_TOKEN", "\"${prop('roam.hub.token', '')}\""
        buildConfigField "String", "TTS_HOST", "\"${prop('roam.tts.host', '100.67.237.109')}\""
        buildConfigField "int", "TTS_PORT", "${prop('roam.tts.port', '10200')}"
        buildConfigField "String", "TTS_VOICE", "\"${prop('roam.tts.voice', 'en_US-ryan-high')}\""

        // Whisper (wyoming-faster-whisper, small-int8) — the input half of the voice
        // loop. Same host as Piper, one port up. Language is pinned rather than
        // auto-detected: a one-word command like "continue" is not enough signal for
        // language ID, and a misdetect turns it into transliterated nonsense.
        buildConfigField "String", "STT_HOST", "\"${prop('roam.stt.host', '100.67.237.109')}\""
        buildConfigField "int", "STT_PORT", "${prop('roam.stt.port', '10300')}"
        buildConfigField "String", "STT_LANG", "\"${prop('roam.stt.lang', 'en')}\""

        // ⚠️ Home Assistant. `roam.ha.token` is a LONG-LIVED ACCESS TOKEN and only Nick
        // can mint one — HA issues them from Profile → Security, behind his password,
        // and there is no API to create one. It is intentionally empty here: the app
        // builds and runs without it and says so on screen, rather than pretending.
        //
        //   local.properties:  roam.ha.token=eyJhbGciOi…
        //   or environment:    ROAM_HA_TOKEN=eyJhbGciOi…
        //
        // `roam.ha.entities` is optional: a comma-separated list of entity ids to pin,
        // in order. Empty means "pick the actionable ones automatically".
        buildConfigField "String", "HA_URL", "\"${prop('roam.ha.url', 'http://100.67.114.94:8123')}\""
        buildConfigField "String", "HA_TOKEN", "\"${prop('roam.ha.token', '')}\""
        buildConfigField "String", "HA_ENTITIES", "\"${prop('roam.ha.entities', '')}\""
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }

    packagingOptions {
        resources.excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/*.kotlin_module',
        ]
    }

    lint {
        // targetSdk 29 is deliberate: sailfish runs Android 10 and this app is
        // sideloaded, never shipped through Play.
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.robolectric:robolectric:4.12.2'
    testImplementation 'androidx.test:core:1.5.0'
    testImplementation platform('androidx.compose:compose-bom:2024.06.00')
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
