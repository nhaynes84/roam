plugins {
    id 'com.android.application'
}

android {
    namespace 'com.roam.touch'
    compileSdk 34

    defaultConfig {
        applicationId "com.roam.touch"
        minSdk 26
        //noinspection ExpiredTargetSdkVersion,OldTargetApi
        targetSdk 29
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // targetSdk 29 is deliberate: sailfish runs Android 10 and this app is
        // sideloaded, never shipped through Play.
        abortOnError false
    }
}
