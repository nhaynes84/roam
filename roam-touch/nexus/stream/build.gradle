plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

// Same token contract as :app — read from the gitignored local.properties, and a
// missing token still builds so the failure is a visible state, not a silence.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def prop = { String key, String fallback ->
    return localProps.getProperty(key, System.getenv(key.toUpperCase().replace('.', '_')) ?: fallback)
}

android {
    namespace 'com.roam.stream'
    compileSdk 34

    defaultConfig {
        applicationId "com.roam.stream"
        minSdk 26
        // ★ NOT pinned to 29 like :app. That pin exists for sailfish (the Pixel 1
        //   running Android 10); this app is for the Pixel 11 and should behave like
        //   a modern app — runtime permissions, scoped everything.
        targetSdk 34
        versionCode 1
        versionName "0.1.0"

        buildConfigField "String", "HUB_URL", "\"${prop('roam.hub.url', 'http://100.67.237.109:8787')}\""
        buildConfigField "String", "HUB_TOKEN", "\"${prop('roam.hub.token', '')}\""
    }

    buildTypes {
        debug { applicationIdSuffix '' }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideloaded, never through Play
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // ★ SHARED SOURCE, NOT A COPY. :app's model/net/audio packages are already the
    //   hub protocol client and they are launcher-clean (verified: zero imports of
    //   com.roam.touch.apps/settings/ha/MainActivity). Pointing at them keeps ONE
    //   implementation of the wire format — a fork would drift the moment the hub's
    //   contract moved, and the wrist app would be the one that broke silently.
    // ⚠️ Deliberately NOT including channels/ui, Roam.kt or HubService.kt: those are
    //   the launcher-coupled parts, and they are wrist-shaped anyway.
    sourceSets {
        main {
            java.srcDirs += [
                    '../app/src/main/java/com/roam/touch/channels/model',
                    '../app/src/main/java/com/roam/touch/channels/net',
            ]
        }
    }

    packagingOptions {
        resources.excludes += [
                'META-INF/AL2.0',
                'META-INF/LGPL2.1',
                'META-INF/*.kotlin_module',
        ]
    }
    lint { abortOnError false }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.activity:activity-compose:1.9.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.2'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.8.1'
}
